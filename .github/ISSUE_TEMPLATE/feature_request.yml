name: Feature request
description: Propose an isolation case, validation method or design improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to test?
      description: The agent boundary, the synthetic interaction and the expected result.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like sauron to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
